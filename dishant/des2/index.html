<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technovation - Networking Club ABES</title>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.png">
  
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('technovation-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter+Tight:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="components/BookReader/FullScreenReader.css?v=2.3">

  <style>
    :root, [data-theme="light"] {
      --paper: #EDEBE6;
      --sheet: #F4F2ED;
      --ink: #141414;
      --muted: #6D6A63;
      --cobalt: #1F3FB0;
      --rule: rgba(20, 20, 20, 0.9);
      --rule-subtle: rgba(20, 20, 20, 0.15);
      --nav-bg: rgba(237, 235, 230, 0.55);
      --play-bg: rgba(237, 235, 230, 0.75);
      --arrow-bg: #EDEBE6;
      --arrow-hover-bg: #141414;
      --arrow-hover-color: #EDEBE6;
      --crest-filter: drop-shadow(0 2px 3px rgba(10, 10, 10, 0.32)) drop-shadow(0 8px 16px rgba(15, 20, 30, 0.22)) drop-shadow(0 16px 28px rgba(0, 0, 0, 0.14));
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --ease-sheet: cubic-bezier(0.76, 0, 0.18, 1);
      
      --font-sans: "Inter Tight", system-ui, -apple-system, sans-serif;
      --font-serif: "Newsreader", Georgia, serif;

      /* Desktop book proportions - clamped for large/4K, laptops, and standard screens */
      --H: clamp(190px, min(39vh, 26vw), 400px);
      --ws: 65px;
      --d: 250px;
    }

    [data-theme="dark"] {
      --paper: #090B10;
      --sheet: #0F121C;
      --ink: #EAE6DF;
      --muted: #959188;
      --cobalt: #527FFF;
      --rule: rgba(234, 230, 223, 0.28);
      --rule-subtle: rgba(234, 230, 223, 0.12);
      --nav-bg: rgba(14, 18, 28, 0.78);
      --play-bg: rgba(14, 18, 30, 0.88);
      --arrow-bg: #141824;
      --arrow-hover-bg: #527FFF;
      --arrow-hover-color: #FFFFFF;
      --crest-filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 22px rgba(82, 127, 255, 0.42)) drop-shadow(0 0 16px rgba(255, 106, 0, 0.35)) drop-shadow(0 12px 28px rgba(0, 0, 0, 0.75));
    }

    /* Tablet breakpoint (768px - 1024px) */
    @media (min-width: 768px) and (max-width: 1024px) {
      :root {
        --H: clamp(180px, min(38vh, 26vw), 320px);
        --ws: 52px;
        --d: 200px;
      }
    }

    /* Mobile portrait breakpoint (≤ 767px) */
    @media (max-width: 767px) {
      :root {
        --H: clamp(165px, min(65vw, 36vh, 36svh), 260px);
        --ws: 40px;
        --d: 155px;
      }
    }

    /* Ultra-narrow phones (≤ 360px) */
    @media (max-width: 360px) {
      :root {
        --H: clamp(140px, min(62vw, 34vh, 34svh), 200px);
        --ws: 32px;
        --d: 130px;
      }
    }

    /* Short height / Mobile Landscape (≤ 520px height) */
    @media (max-height: 520px) {
      :root {
        --H: clamp(120px, 38vh, 175px);
        --ws: 32px;
        --d: 125px;
      }
    }

    /* Reset and global styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.4s var(--ease), color 0.4s var(--ease);
    }

    /* Light Mode Ambient Archival Studio Atmosphere */
    :root:not([data-theme="dark"]) body,
    html[data-theme="light"] body {
      background-color: #EDEBE6;
      background-image: 
        radial-gradient(ellipse 75% 55% at 50% 36%, rgba(255, 255, 255, 0.8) 0%, rgba(252, 249, 242, 0.45) 45%, transparent 75%),
        radial-gradient(ellipse 55% 40% at 18% 18%, rgba(255, 150, 40, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 82% 80%, rgba(48, 102, 255, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse 95% 85% at 50% 50%, transparent 50%, rgba(150, 135, 115, 0.16) 100%);
      background-attachment: fixed;
    }

    /* Dark Mode Ambient Celestial Atmosphere */
    html[data-theme="dark"] body {
      background-color: #090B10;
      background-image: 
        radial-gradient(ellipse 70% 55% at 50% 50%, rgba(28, 58, 140, 0.22) 0%, transparent 72%),
        radial-gradient(ellipse 50% 40% at 18% 22%, rgba(255, 110, 20, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 82% 78%, rgba(68, 128, 255, 0.12) 0%, transparent 65%),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(4, 5, 8, 0.75) 100%);
      background-attachment: fixed;
    }

    /* Hide native cursor on fine pointers */
    @media (pointer: fine) {
      html, body, button, a, [role="button"] {
        cursor: none !important;
      }
    }

    /* Label system */
    .lbl {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 10.5px;
      line-height: 1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 21px;
      padding: 0 8px;
      border: 1px solid var(--rule);
      box-sizing: border-box;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.35s var(--ease), color 0.35s var(--ease), background-color 0.35s var(--ease);
    }

    /* Paper grain overlay */
    .paper-grain {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 40;
      pointer-events: none;
      mix-blend-mode: multiply;
      opacity: 0.55;
      transition: opacity 0.4s var(--ease), filter 0.4s var(--ease);
    }

    [data-theme="dark"] .paper-grain {
      mix-blend-mode: screen;
      opacity: 0.15;
      filter: invert(1);
    }

    /* Probe element for precise height calculation */
    #probe {
      position: absolute;
      top: -9999px;
      left: -9999px;
      height: var(--H);
      width: 1px;
      pointer-events: none;
      visibility: hidden;
    }

    /* 1. Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: clamp(68px, 9.5vh, 102px);
      padding: clamp(12px, 1.8vh, 22px) clamp(16px, 3vw, 32px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: auto;
    }

    .top-left {
      display: flex;
      align-items: center;
      z-index: 1;
    }

    /* 3D Crest Badge */
    .crest-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      height: clamp(48px, 6.8vh, 68px);
      width: auto;
      aspect-ratio: 1188 / 1324;
      flex-shrink: 0;
      background: transparent !important;
      border: none !important;
      outline: none;
      filter: var(--crest-filter);
      user-select: none;
      -webkit-user-drag: none;
      transition: filter 0.35s var(--ease);
    }

    .crest-img {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 0.5vh, 5px);
      color: var(--cobalt);
      text-decoration: none;
      line-height: 1;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      pointer-events: auto;
      z-index: 2;
    }

    .logo-main {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(20px, 2.3vw, 28px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-block;
      /* Light Mode: Vibrant Solar Flame Orange to Royal Cobalt Blue Gradient */
      background: linear-gradient(118deg, #E65100 0%, #FF6F00 26%, #FFA000 42%, #3066FF 70%, #15399E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.85)) drop-shadow(0 2px 4px rgba(20, 25, 45, 0.22));
      transition: transform 0.25s var(--ease), filter 0.25s var(--ease);
      will-change: transform, filter;
    }

    .logo:hover .logo-main {
      transform: translateY(-2px);
      filter: drop-shadow(0 2px 8px rgba(230, 81, 0, 0.38)) drop-shadow(0 3px 12px rgba(48, 102, 255, 0.38));
    }

    [data-theme="dark"] .logo-main {
      /* Dark Mode: Luminous Neon Flame Orange to Electric Neon Cobalt Gradient */
      background: linear-gradient(118deg, #FF6A00 0%, #FFA229 30%, #6490FF 66%, #3369FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(255, 106, 0, 0.44)) drop-shadow(0 0 24px rgba(82, 127, 255, 0.5));
    }

    [data-theme="dark"] .logo:hover .logo-main {
      transform: translateY(-2px);
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 24px rgba(255, 106, 0, 0.65)) drop-shadow(0 0 34px rgba(82, 127, 255, 0.72));
    }

    .logo-sub {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(8px, 0.85vw, 10px);
      letter-spacing: 0.3em;
      padding-left: 0.3em; /* optically centered */
      color: var(--muted);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: color 0.35s var(--ease), text-shadow 0.35s var(--ease);
    }

    [data-theme="dark"] .logo-sub {
      color: rgba(234, 230, 223, 0.65);
      letter-spacing: 0.32em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 10px rgba(82, 127, 255, 0.25);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      z-index: 1;
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 25px;
      padding: 0 10px;
      border: 1px solid rgba(35, 25, 15, 0.14);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(35, 25, 15, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      color: var(--ink);
      cursor: pointer;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 8.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      outline: none;
      transition: background-color 0.25s var(--ease), border-color 0.25s var(--ease), color 0.25s var(--ease), transform 0.2s var(--ease), box-shadow 0.25s var(--ease);
      user-select: none;
      text-decoration: none;
      white-space: nowrap;
    }

    [data-theme="dark"] .theme-toggle-btn {
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--nav-bg);
      box-shadow: none;
    }

    .theme-toggle-btn:hover {
      background-color: var(--cobalt);
      border-color: var(--cobalt);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(31, 63, 176, 0.25);
    }

    .theme-toggle-btn:active {
      transform: translateY(0);
    }

    .theme-icon-slot {
      position: relative;
      width: 13px;
      height: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .theme-icon {
      position: absolute;
      width: 13px;
      height: 13px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s var(--ease);
    }

    :root:not([data-theme="dark"]) .icon-sun,
    [data-theme="light"] .icon-sun {
      transform: rotate(90deg) scale(0);
      opacity: 0;
      pointer-events: none;
    }

    :root:not([data-theme="dark"]) .icon-moon,
    [data-theme="light"] .icon-moon {
      transform: rotate(0deg) scale(1);
      opacity: 1;
    }

    [data-theme="dark"] .icon-sun {
      transform: rotate(0deg) scale(1);
      opacity: 1;
    }

    [data-theme="dark"] .icon-moon {
      transform: rotate(-90deg) scale(0);
      opacity: 0;
      pointer-events: none;
    }

    /* 2. Chapter Tabs */
    .tab-desktop { display: inline; }
    .tab-mobile { display: none; }

    @media (max-width: 767px) {
      .tab-desktop { display: none; }
      .tab-mobile { display: inline; }
    }

    .decade-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(50% - var(--H) / 2 - clamp(82px, 11.5vh, 115px));
      display: flex;
      align-items: center;
      width: min(94vw, 750px);
      height: clamp(32px, 4.1vh, 38px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 
        0 14px 36px -4px rgba(35, 25, 15, 0.08),
        0 4px 12px -2px rgba(35, 25, 15, 0.04),
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.03);
      box-sizing: border-box;
      overflow: hidden !important;
      z-index: 30;
      padding: 3px 4px;
      transition: background-color 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease), top 0.35s var(--ease);
    }

    [data-theme="dark"] .decade-nav {
      background: rgba(14, 18, 28, 0.62);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        0 16px 40px -4px rgba(0, 0, 0, 0.75),
        0 0 22px rgba(82, 127, 255, 0.18),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.22),
        inset 0 -1px 1px rgba(0, 0, 0, 0.4);
      border-radius: 9999px;
    }

    .decade-indicator {
      position: absolute;
      top: 3px;
      bottom: 3px;
      height: calc(100% - 6px);
      background: linear-gradient(135deg, #1B38A6 0%, #112470 100%);
      box-shadow: 
        0 3px 12px rgba(27, 56, 166, 0.38),
        0 1px 3px rgba(27, 56, 166, 0.22),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      z-index: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      width: 0;
      transform: translateX(0);
    }

    [data-theme="dark"] .decade-indicator {
      background: linear-gradient(118deg, #FF6A00 0%, #FFA229 28%, #527FFF 70%, #2855E0 100%);
      box-shadow: 
        0 4px 14px rgba(82, 127, 255, 0.45),
        0 0 14px rgba(255, 106, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      border-radius: 9999px;
    }

    .decade-btn {
      position: relative;
      z-index: 1;
      height: 100%;
      flex: 1 1 0;
      min-width: 0;
      padding: 0 4px;
      border: none;
      border-radius: 9999px;
      margin: 0;
      background: transparent;
      color: rgba(45, 38, 30, 0.72);
      cursor: pointer;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(7.2px, 0.85vw, 9.4px);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: color 0.3s var(--ease), background-color 0.25s var(--ease), transform 0.2s var(--ease);
      outline: none;
      box-sizing: border-box;
    }

    .decade-btn:hover:not(.active) {
      color: #1F3FB0;
      background: rgba(31, 63, 176, 0.07);
    }

    .decade-btn:last-of-type {
      border-right: none;
    }

    .decade-btn.active {
      color: #FFFFFF;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    [data-theme="dark"] .decade-btn {
      color: rgba(234, 230, 223, 0.72);
      border-right: none;
    }

    [data-theme="dark"] .decade-btn:hover:not(.active) {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      text-shadow: 0 0 8px rgba(82, 127, 255, 0.5);
    }

    [data-theme="dark"] .decade-btn.active {
      color: #FFFFFF;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    /* 3. The Shelf (3D Stage: 8 Bespoke Storybooks Perfectly Centered) */
    .shelf-section {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(50% - var(--H) / 2 - 40px);
      height: calc(var(--H) + 80px);
      perspective: 2200px;
      perspective-origin: 50% 50%;
      touch-action: pan-y;
      z-index: 10;
      overflow: visible;
    }

    /* Light Orangish Glow Behind the Bookshelf */
    .shelf-section::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(96vw, 1020px);
      height: calc(var(--H) * 1.55);
      background: radial-gradient(ellipse 65% 55% at 50% 50%, 
        rgba(255, 135, 25, 0.52) 0%, 
        rgba(255, 160, 45, 0.34) 30%, 
        rgba(255, 190, 80, 0.16) 55%, 
        rgba(255, 215, 140, 0.05) 72%, 
        transparent 85%);
      border-radius: 50%;
      filter: blur(36px);
      pointer-events: none;
      z-index: 0;
      opacity: 1;
      transition: opacity 0.4s var(--ease);
    }

    [data-theme="dark"] .shelf-section::before {
      opacity: 0;
    }

    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      z-index: 1;
    }

    .tape {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
      cursor: pointer;
    }

    .sp, .cv {
      position: absolute;
      height: var(--H);
      top: calc(var(--H) * -0.5);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 3px;
      overflow: hidden;
      transition: box-shadow 0.35s var(--ease);
    }

    .sp {
      width: var(--ws);
      left: calc(var(--ws) * -0.5);
      transform: translateZ(calc(var(--d) * 0.5));
    }

    .cv {
      width: var(--d);
      left: calc(var(--d) * -0.5);
      transform: rotateY(90deg) translateZ(calc(var(--ws) * 0.5));
      box-shadow: none;
    }

    /* Dynamic overlay shading */
    .sp::after, .cv::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #000000;
      opacity: var(--shade, 0);
      pointer-events: none;
      border-radius: inherit;
      z-index: 10;
    }

    /* Custom Spine Label Plaque (Full Coverage) */
    .sp-label {
      position: absolute;
      top: 10%;
      bottom: 10%;
      left: 4px;
      right: 4px;
      background: rgba(14, 16, 22, 0.95);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 3px 8px rgba(0, 0, 0, 0.6);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 2px;
      z-index: 4;
      pointer-events: none;
    }

    .sp-icon {
      width: 18px;
      height: 18px;
      margin-bottom: 2px;
      opacity: 0.95;
    }

    .sp-vol {
      font-family: var(--font-sans);
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    .sp-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 1);
      margin: auto 0;
      white-space: nowrap;
    }

    .sp-badge {
      font-family: var(--font-sans);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.75);
      padding: 1px 4px;
      border-radius: 1px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    /* Cover Graphic & Card System */
    .cv-bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(10,12,18,0.2) 0%, rgba(10,12,18,0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .cv-center-graphic {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
      padding: 30px;
    }

    .cv-center-graphic svg {
      width: 100%;
      max-width: 150px;
      height: auto;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.8));
    }

    .cv-plate {
      position: absolute;
      top: 10px;
      left: 8px;
      right: 8px;
      background: rgba(12, 14, 20, 0.94);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), inset 0 0 12px rgba(0, 0, 0, 0.5);
      border-radius: 3px;
      padding: 9px 12px 10px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
      box-sizing: border-box;
    }

    .cv-sub {
      font-family: var(--font-sans);
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.22);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .cv-sub span:first-child {
      background: linear-gradient(118deg, #FF7A18 0%, #FFA834 35%, #6B97FF 72%, #3867FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .cv-title {
      font-family: var(--font-serif);
      font-size: clamp(12.5px, 1.4vw, 15.5px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 1);
      margin-top: 3px;
      white-space: nowrap;
      text-align: left;
    }

    .cv-tagline {
      display: block;
      font-family: var(--font-sans);
      font-size: 7.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 3px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cv-foot-plate {
      position: absolute;
      bottom: 10px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 4;
      background: rgba(12, 14, 20, 0.9);
      padding: 6px 10px;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
      box-sizing: border-box;
    }

    .cv-edition {
      font-family: var(--font-sans);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #FFFFFF;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
    }

    .cv-badge {
      font-family: var(--font-sans);
      font-size: 7.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.85);
      padding: 2px 5px;
      border-radius: 1px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* 4. Play Ring */
    .play-ring {
      position: fixed;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid var(--cobalt);
      color: var(--cobalt);
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 
        0 6px 20px rgba(31, 63, 176, 0.22),
        0 2px 6px rgba(35, 25, 15, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      cursor: pointer;
      outline: none;
      transform: translate(-50%, -50%) scale(0);
      transition: border-color 0.3s var(--ease), background-color 0.3s var(--ease), color 0.3s var(--ease), box-shadow 0.3s var(--ease), transform 0.25s var(--ease);
      padding: 0;
    }

    .play-ring:hover {
      background-color: var(--cobalt);
      color: #FFFFFF;
      box-shadow: 
        0 8px 26px rgba(31, 63, 176, 0.38),
        0 3px 8px rgba(31, 63, 176, 0.2);
    }

    [data-theme="dark"] .play-ring {
      background: rgba(14, 18, 30, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(82, 127, 255, 0.55);
      color: #527FFF;
      box-shadow: 
        0 6px 24px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(82, 127, 255, 0.4),
        inset 0 0 10px rgba(255, 106, 0, 0.25);
    }

    [data-theme="dark"] .play-ring:hover {
      border-color: #8EB3FF;
      color: #FFFFFF;
      box-shadow: 
        0 8px 30px rgba(0, 0, 0, 0.75),
        0 0 28px rgba(82, 127, 255, 0.65),
        0 0 16px rgba(255, 106, 0, 0.45);
    }

    .play-triangle {
      width: 12px;
      height: 12px;
      margin-left: 2px;
      fill: currentColor;
    }

    /* 5. Caption */
    .caption-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(50% + var(--H) / 2 + clamp(40px, 5.8vh, 62px));
      width: min(84vw, calc(100vw - 140px), 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 1vh, 9px);
      pointer-events: none;
      z-index: 20;
    }

    .caption-mask {
      overflow: hidden;
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .caption-title {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(22px, 2.5vw, 31px);
      line-height: 1.12;
      letter-spacing: -0.01em;
      color: var(--ink);
      text-align: center;
      min-height: calc(clamp(22px, 2.5vw, 31px) * 1.12);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8), 0 2px 4px rgba(35, 25, 15, 0.06);
    }

    [data-theme="dark"] .caption-title {
      color: #FFFFFF;
      text-shadow: 
        0 2px 16px rgba(0, 0, 0, 0.9),
        0 0 32px rgba(82, 127, 255, 0.28);
    }

    .caption-sub {
      color: var(--cobalt);
      font-weight: 500;
      min-height: 13px;
    }

    [data-theme="dark"] .caption-sub {
      color: #FFA338;
      text-shadow: 0 0 10px rgba(255, 163, 56, 0.35);
      letter-spacing: 0.12em;
    }

    .caption-year {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink);
      min-height: 14px;
    }

    [data-theme="dark"] .caption-year {
      color: rgba(234, 230, 223, 0.7);
    }

    /* 6. Navigation Arrows */
    .arrow-btn {
      position: fixed;
      top: calc(50% + var(--H) / 2 + clamp(40px, 5.8vh, 62px) + 16px);
      transform: translateY(-50%);
      width: clamp(38px, 3.6vw, 46px);
      height: clamp(38px, 3.6vw, 46px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(40, 30, 20, 0.12);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--ink);
      cursor: pointer;
      z-index: 30;
      outline: none;
      border-radius: 6px;
      box-shadow: 
        0 4px 16px rgba(35, 25, 15, 0.08),
        0 1px 3px rgba(35, 25, 15, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      transition: transform 0.2s var(--ease), background-color 0.25s var(--ease), color 0.25s var(--ease), opacity 0.25s var(--ease), border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    [data-theme="dark"] .arrow-btn {
      background: rgba(16, 20, 32, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(82, 127, 255, 0.3);
      color: #EAE6DF;
      border-radius: 2px;
      box-shadow: 
        0 4px 18px rgba(0, 0, 0, 0.6),
        0 0 12px rgba(82, 127, 255, 0.15);
    }

    .arrow-btn:hover:not(:disabled) {
      background-color: #141414;
      color: #FFFFFF;
      border-color: #141414;
      transform: translateY(-50%) translateY(-2px) scale(1.05);
      box-shadow: 
        0 8px 24px rgba(20, 20, 20, 0.22),
        0 2px 6px rgba(20, 20, 20, 0.1);
    }

    [data-theme="dark"] .arrow-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(255, 106, 0, 0.25) 0%, rgba(82, 127, 255, 0.45) 100%);
      border-color: #527FFF;
      color: #FFFFFF;
      box-shadow: 
        0 6px 24px rgba(0, 0, 0, 0.75),
        0 0 22px rgba(82, 127, 255, 0.55),
        0 0 14px rgba(255, 106, 0, 0.35);
    }

    .arrow-btn:active:not(:disabled) {
      transform: translateY(-50%) scale(0.95);
    }

    .arrow-left {
      left: clamp(14px, 2vw, 24px);
    }

    .arrow-right {
      right: clamp(14px, 2vw, 24px);
    }

    /* 7. Footer */
    .footer {
      position: fixed;
      left: clamp(16px, 2.5vw, 32px);
      right: clamp(16px, 2.5vw, 32px);
      bottom: clamp(12px, 2.2vh, 26px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }

    .foot-link {
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .foot-link:hover {
      color: var(--cobalt);
    }

    .foot-copy {
      color: var(--muted) !important;
      text-transform: lowercase !important;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .foot-extra {
      color: inherit;
      text-transform: inherit;
    }

    /* 8. Custom Cursor */
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 58px;
      height: 58px;
      margin-left: -29px;
      margin-top: -29px;
      pointer-events: none;
      z-index: 100005;
      display: none;
    }

    @media (pointer: fine) {
      .cursor {
        display: block;
      }
    }

    .cursor-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      box-sizing: border-box;
      background-color: transparent;
      transform: scale(1);
      transition: transform 0.5s var(--ease), background-color 0.4s var(--ease), border-color 0.4s var(--ease);
    }

    .cursor-dot {
      position: absolute;
      left: calc(50% - 3px);
      top: calc(50% - 3px);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      transform: scale(1);
      transition: transform 0.4s var(--ease);
    }

    .cursor-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 10px;
      line-height: 1.25;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: scale(0);
      transition: transform 0.45s var(--ease);
      pointer-events: none;
    }

    .cursor.is-spine .cursor-ring {
      transform: scale(0.72);
    }

    .cursor.is-spine .cursor-dot {
      transform: scale(1);
    }

    .cursor.is-btn .cursor-ring {
      transform: scale(0.55);
    }

    .cursor.is-btn .cursor-dot {
      transform: scale(0);
    }

    .cursor.is-open .cursor-ring {
      transform: scale(1.75);
      background-color: var(--cobalt);
      border-color: var(--cobalt);
    }

    .cursor.is-open .cursor-dot {
      transform: scale(0);
    }

    .cursor.is-open .cursor-label {
      transform: scale(1);
    }

    /* Opening Film Detail Dialog */
    .detail {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--sheet);
      z-index: 60;
      visibility: hidden;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4vw;
      padding: 110px 6vw 56px 7vw;
      align-items: center;
      transition: background-color 0.4s var(--ease), opacity 0.4s var(--ease);
    }

    :root:not([data-theme="dark"]) .detail,
    [data-theme="light"] .detail {
      background: 
        radial-gradient(circle at 74% 50%, rgba(31, 63, 176, 0.05) 0%, transparent 58%),
        radial-gradient(circle at 24% 35%, rgba(255, 106, 0, 0.04) 0%, transparent 48%),
        #F4F2ED;
    }

    [data-theme="dark"] .detail {
      background-color: #0A0C13;
      background-image: 
        radial-gradient(circle at 74% 50%, rgba(48, 90, 220, 0.22) 0%, transparent 62%),
        radial-gradient(circle at 24% 38%, rgba(255, 106, 0, 0.12) 0%, transparent 52%),
        radial-gradient(ellipse at 50% 100%, rgba(14, 20, 42, 0.85) 0%, transparent 80%),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(4, 5, 8, 0.8) 100%);
      background-attachment: fixed;
    }

    .detail-close {
      position: fixed;
      top: 31px;
      left: 32px;
      z-index: 70;
      cursor: pointer;
    }

    [data-theme="dark"] .detail-close {
      background: rgba(16, 20, 32, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(82, 127, 255, 0.35);
      color: #EAE6DF;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      transition: all 0.25s var(--ease);
    }

    [data-theme="dark"] .detail-close:hover {
      border-color: #527FFF;
      color: #FFFFFF;
      background: rgba(28, 38, 62, 0.95);
      box-shadow: 0 0 20px rgba(82, 127, 255, 0.5);
      transform: translateY(-1px);
    }

    .detail-logo-band {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 65;
      pointer-events: none;
    }

    .detail-logo-band .logo {
      pointer-events: auto;
    }

    .detail-left-col {
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      justify-self: center;
    }

    .mask-line {
      overflow: hidden;
      display: block;
    }

    .mask-line > * {
      display: block;
    }

    .detail-title {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(38px, 4.8vw, 76px);
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--ink);
    }

    [data-theme="dark"] .detail-title {
      color: #FFFFFF;
      text-shadow: 
        0 2px 24px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(82, 127, 255, 0.22);
    }

    .detail-sub {
      color: var(--cobalt);
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    [data-theme="dark"] .detail-sub {
      color: #FFA338;
      text-shadow: 0 0 14px rgba(255, 163, 56, 0.4);
      letter-spacing: 0.14em;
    }

    .detail-meta {
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    [data-theme="dark"] .detail-meta {
      color: rgba(234, 230, 223, 0.72);
      letter-spacing: 0.08em;
    }

    .detail-synopsis {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 16.5px;
      line-height: 1.6;
      max-width: 44ch;
      color: var(--ink);
    }

    [data-theme="dark"] .detail-synopsis {
      color: rgba(234, 230, 223, 0.92);
    }

    .detail-credit {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.4;
    }

    [data-theme="dark"] .detail-credit {
      color: rgba(149, 145, 136, 0.85);
    }

    .detail-watch-btn {
      position: relative;
      height: 48px;
      padding: 0 26px;
      border: 1.5px solid var(--cobalt);
      background: linear-gradient(135deg, rgba(230, 81, 0, 0.08) 0%, rgba(31, 63, 176, 0.12) 100%);
      color: var(--cobalt);
      border-radius: 4px;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
      align-self: flex-start;
      box-shadow: 0 3px 12px rgba(20, 20, 30, 0.1);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .detail-watch-btn:hover {
      background: linear-gradient(135deg, #E8590C 0%, #1F3FB0 100%);
      border-color: transparent;
      color: #FFFFFF;
      box-shadow: 0 6px 24px rgba(31, 63, 176, 0.35), 0 0 16px rgba(232, 89, 12, 0.28);
      transform: translateY(-2px);
    }

    [data-theme="dark"] .detail-watch-btn {
      border: 1px solid rgba(82, 127, 255, 0.6);
      background: linear-gradient(135deg, rgba(255, 106, 0, 0.18) 0%, rgba(45, 85, 210, 0.3) 100%);
      color: #FFFFFF;
      box-shadow: 
        0 6px 24px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(82, 127, 255, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    [data-theme="dark"] .detail-watch-btn:hover {
      background: linear-gradient(135deg, #FF6A00 0%, #3B72FF 100%);
      border-color: #8EB3FF;
      color: #FFFFFF;
      box-shadow: 
        0 8px 32px rgba(59, 114, 255, 0.55),
        0 0 28px rgba(255, 106, 0, 0.45);
      transform: translateY(-2px);
    }

    .detail-right-col {
      justify-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .detail-book-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: min(100%, 78vh);
      max-height: 78vh;
      aspect-ratio: 474 / 900;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.55),
        0 12px 24px -8px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(0, 0, 0, 0.12);
      transform-style: preserve-3d;
      transition: box-shadow 0.4s var(--ease);
    }

    [data-theme="dark"] .detail-book-frame {
      box-shadow: 
        0 35px 80px -15px rgba(0, 0, 0, 0.95),
        0 15px 35px -10px rgba(0, 0, 0, 0.75),
        0 0 45px rgba(82, 127, 255, 0.32),
        0 0 90px rgba(255, 106, 0, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .detail-poster-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .detail-book-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: inherit;
      overflow: hidden;
      z-index: 5;
    }

    .detail-book-overlay.is-visible {
      opacity: 1;
    }

    .detail-book-overlay .cv-bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(10, 12, 18, 0.25) 0%, rgba(10, 12, 18, 0.88) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .detail-book-overlay .cv-plate {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;

    @media (max-height: 520px) {

<body>

  <!-- Probe for measuring exact --H -->
  <div id="probe"></div>

  <!-- Common SVG Gradients for Graphics -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>
      <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#67E8F9" />
        <stop offset="100%" stop-color="#059669" />
      </linearGradient>
      <linearGradient id="grad-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F472B6" />
        <stop offset="100%" stop-color="#7C3AED" />
      </linearGradient>
      <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8" />
        <stop offset="100%" stop-color="#1D4ED8" />
      </linearGradient>
      <linearGradient id="grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FBBF24" />
        <stop offset="100%" stop-color="#DC2626" />
      </linearGradient>
      <linearGradient id="grad-flame" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE047" />
        <stop offset="50%" stop-color="#EA580C" />
        <stop offset="100%" stop-color="#DC2626" />
      </linearGradient>
      <linearGradient id="grad-events" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FB7185" />
        <stop offset="50%" stop-color="#F43F5E" />
        <stop offset="100%" stop-color="#FB923C" />
      </linearGradient>
      <linearGradient id="grad-graphics" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#A78BFA" />
        <stop offset="50%" stop-color="#818CF8" />
        <stop offset="100%" stop-color="#38BDF8" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Paper Grain Overlay -->
  <svg class="paper-grain" aria-hidden="true" width="100%" height="100%">
    <defs>
      <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise" />
        <feColorMatrix type="matrix" values="
          0 0 0 0 0.45
          0 0 0 0 0.42
          0 0 0 0 0.38
          0 0 0 0.22 0" />
      </filter>
      <pattern id="grain-pattern" width="220" height="220" patternUnits="userSpaceOnUse">
        <rect width="220" height="220" filter="url(#grain-filter)" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grain-pattern)" />
  </svg>

  <!-- 1. Top Bar -->
  <header class="top-bar">
    <div class="top-left">
      <div class="crest-badge" title="Technovation Networking Club ABES" aria-label="Technovation Networking Club ABES">
        <img src="technovation_crest.png" alt="Technovation Networking Club Crest" class="crest-img" width="1188" height="1324" loading="eager" fetchpriority="high" decoding="sync" />
      </div>
    </div>
    <div class="logo">
      <span class="logo-main">TECHNOVATION</span>
      <span class="logo-sub">STORY ARCHIVES</span>
    </div>

        easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',

        if (oldSpan.dataset.leaving) return;
        oldSpan.dataset.leaving = 'true';
        const currentTransform = window.getComputedStyle(oldSpan).transform;
        const anim = oldSpan.animate([

          duration: 650,

        }, prefersReducedMotion ? 10 : 350);
      }

      // Reset blobs
      BLOBS.forEach((_, i) => {
        const el = document.getElementById(`ink-blob-${i + 1}`);
        if (el) el.setAttribute('r', '0');
      });

      // Get active tape cover screen rect
      const activeTape = tapes[activeBook] || tapes[0];
      const coverFace = activeTape.el.querySelector('.cv');
      const rawRect = (coverFace && coverFace.getBoundingClientRect().width > 0)
        ? coverFace.getBoundingClientRect()
        : {
            top: window.innerHeight * 0.25,
            left: window.innerWidth * 0.35,
            right: window.innerWidth * 0.65,
            bottom: window.innerHeight * 0.75,
            width: window.innerWidth * 0.3,
            height: window.innerHeight * 0.5
          };

      const top = Math.max(0, Math.round(rawRect.top));
      const right = Math.max(0, Math.round(window.innerWidth - rawRect.right));
      const bottom = Math.max(0, Math.round(window.innerHeight - rawRect.bottom));
      const left = Math.max(0, Math.round(rawRect.left));

      const startClip = `inset(${top}px ${right}px ${bottom}px ${left}px round 3px)`;
      const endClip = 'inset(0px 0px 0px 0px round 0px)';

      detail.style.transformOrigin = `${Math.round(left + rawRect.width / 2)}px ${Math.round(top + rawRect.height / 2)}px`;
      detail.style.visibility = 'visible';

      if (currentSheetAnim) currentSheetAnim.cancel();

      currentSheetAnim = detail.animate([
        { clipPath: startClip, transform: 'rotate(-4.5deg)' },
        { clipPath: endClip, transform: 'rotate(0deg)' }
      ], {
        duration: prefersReducedMotion ? 1 : 1050,
        easing: 'cubic-bezier(0.76, 0, 0.18, 1)',
        fill: 'both'
      });

      // Text rises out of masks
      textAnims.forEach(a => a.cancel());
      textAnims = [];

      const lines = detail.querySelectorAll('.detail-left-col .mask-line > *');
      lines.forEach((line, index) => {
        const a = line.animate([
          { transform: 'translateY(110%)' },
          { transform: 'translateY(0%)' }
        ], {
          duration: prefersReducedMotion ? 1 : 900,
          delay: prefersReducedMotion ? 0 : (620 + index * 75),
          easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
          fill: 'both'
        });
        textAnims.push(a);
      });

      // Start poster ink bleed
      startInkAnimation();
    }

    function closeDetail() {
      if (!isOpen) return;
      isOpen = false;

      const detailBookOverlay = document.getElementById('detail-book-overlay');
      if (detailBookOverlay) {
        detailBookOverlay.classList.remove('is-visible');
      }

      if (inkRafId) {
        cancelAnimationFrame(inkRafId);
        inkRafId = null;
      }

      textAnims.forEach(a => a.cancel());
      textAnims = [];

      const activeTape = tapes[activeBook] || tapes[0];
      const coverFace = activeTape.el.querySelector('.cv');
      const rawRect = (coverFace && coverFace.getBoundingClientRect().width > 0)
        ? coverFace.getBoundingClientRect()
        : {
            top: window.innerHeight * 0.25,
            left: window.innerWidth * 0.35,
            right: window.innerWidth * 0.65,
            bottom: window.innerHeight * 0.75,
            width: window.innerWidth * 0.3,
            height: window.innerHeight * 0.5
          };

      const top = Math.max(0, Math.round(rawRect.top));
      const right = Math.max(0, Math.round(window.innerWidth - rawRect.right));
      const bottom = Math.max(0, Math.round(window.innerHeight - rawRect.bottom));
      const left = Math.max(0, Math.round(rawRect.left));
      const targetClip = `inset(${top}px ${right}px ${bottom}px ${left}px round 3px)`;

      detail.style.transformOrigin = `${Math.round(left + rawRect.width / 2)}px ${Math.round(top + rawRect.height / 2)}px`;

      if (currentSheetAnim) currentSheetAnim.cancel();

      currentSheetAnim = detail.animate([
        { clipPath: 'inset(0px 0px 0px 0px round 0px)', transform: 'rotate(0deg)' },
        { clipPath: targetClip, transform: 'rotate(-4.5deg)' }
      ], {
        duration: prefersReducedMotion ? 1 : 850,
        easing: 'cubic-bezier(0.76, 0, 0.18, 1)',
        fill: 'both'
      });

      currentSheetAnim.onfinish = () => {
        detail.style.visibility = 'hidden';
        currentSheetAnim.cancel();
        currentSheetAnim = null;
      };
    }

    detailClose.addEventListener('click', closeDetail);
    playRing.addEventListener('click', openDetail);

    /* --- EXPLORE MANIFESTO: OPEN 3D INTERACTIVE BOOK READER --- */
    detailActionBtn.addEventListener('click', () => {
      const book = BOOKS[activeBook];
      const deptKey = book ? (book.id === 'noon' ? 'about' :
                             book.id === 'green' ? 'technical' :
                             book.id === 'graphics' ? 'graphics' :
                             book.id === 'storm' ? 'production' :
                             book.id === 'events' ? 'events' :
                             book.id === 'bluehour' ? 'pr' :
                             book.id === 'observer' ? 'team' :
                             book.id === 'door' ? 'legacy' : book.id) : 'about';

      // Keep detail dialog visible underneath reader to eliminate any flash of the shelf
      BookReader.open(deptKey, {
        shelfBook: book,
        onClose: () => {
          // Returning from book: ensure detail screen is visible
          detail.style.visibility = 'visible';
        },
        onReturnShelf: () => {
          // Returning to main shelf: close detail dialog completely
          closeDetail();
        }
      });
    });

    /* --- INPUT EVENTS WITH LEFT & RIGHT NAVIGATION --- */
    arrowLeft.addEventListener('click', () => {
      if (BookReader.isOpen) return;
      if (T > 0) {
        T = Math.round(T) - 1;
      }
    });

    arrowRight.addEventListener('click', () => {
      if (BookReader.isOpen) return;
      if (T < BOOKS.length - 1) {
        T = Math.round(T) + 1;
      }
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (BookReader.isOpen) return;
      if (e.key === 'Escape') {
        if (isOpen) closeDetail();
        return;
      }
      if (isOpen) return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (T > 0) T = Math.round(T) - 1;
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (T < BOOKS.length - 1) T = Math.round(T) + 1;
      } else if (e.key === 'Enter') {
        if (document.activeElement === document.body || document.activeElement.tagName === 'BODY' || document.activeElement.classList.contains('shelf-section')) {
          e.preventDefault();
          openDetail();
        }
      } else if (e.key === 't' || e.key === 'T') {
        if (!isOpen && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          if (themeToggleBtn) themeToggleBtn.click();
        }
      }
    });

    // Wheel support
    window.addEventListener('wheel', (e) => {
      if (isOpen || BookReader.isOpen) return;
      const maxIdx = BOOKS.length - 1;
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      T = Math.max(0, Math.min(maxIdx, T + (delta / (ws + gap)) * 0.45));

      clearTimeout(wheelTimeout);
      wheelTimeout = setTimeout(() => {
        T = Math.max(0, Math.min(maxIdx, Math.round(T)));
      }, 160);
    }, { passive: true });

    // Drag support
    const shelfSection = document.getElementById('shelf-section');

    shelfSection.addEventListener('pointerdown', (e) => {
      if ((e.pointerType === 'mouse' && e.button !== 0) || isOpen || BookReader.isOpen) return;
      isPointerDown = true;
      isDragging = false;
      hasMoved = false;
      startPointerX = e.clientX;
      startT = T;
      try {
        shelfSection.setPointerCapture(e.pointerId);
      } catch (_) {}
    });

    window.addEventListener('pointermove', (e) => {
      mx = e.clientX;
      my = e.clientY;

      if (!isPointerDown) return;
      const dx = e.clientX - startPointerX;
      if (!hasMoved && Math.abs(dx) > 5) {
        hasMoved = true;
        isDragging = true;
      }
      if (isDragging) {
        const isMobile = window.innerWidth <= 767;
        const dragStep = isMobile ? Math.max(90, Math.round(d * 0.75)) : (ws + gap);
        const maxIdx = BOOKS.length - 1;
        T = Math.max(-0.2, Math.min(maxIdx + 0.2, startT - dx / dragStep));
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (isPointerDown) {
        try {
          if (e && e.pointerId) shelfSection.releasePointerCapture(e.pointerId);
        } catch (_) {}
        isPointerDown = false;
        if (isDragging) {
          const dx = (e.clientX || mx) - startPointerX;
          const isMobile = window.innerWidth <= 767;
          const maxIdx = BOOKS.length - 1;
          if (isMobile && Math.abs(dx) > 30) {
            T = dx < 0 ? Math.min(maxIdx, Math.ceil(startT + 0.1)) : Math.max(0, Math.floor(startT - 0.1));
          } else {
            T = Math.max(0, Math.min(maxIdx, Math.round(T)));
          }
          setTimeout(() => {
            isDragging = false;
            hasMoved = false;
          }, 60);
        } else {
          isDragging = false;
          hasMoved = false;
        }
      }
    });

    window.addEventListener('pointercancel', (e) => {
      if (isPointerDown) {
        try {
          if (e && e.pointerId) shelfSection.releasePointerCapture(e.pointerId);
        } catch (_) {}
        isPointerDown = false;
        if (isDragging) T = Math.max(0, Math.min(BOOKS.length - 1, Math.round(T)));
        isDragging = false;
        hasMoved = false;
      }
    });

    // Track button hovers dynamically for custom cursor across the entire site and reader
    window.addEventListener('pointerover', (e) => {
      if (e.target && e.target.closest && e.target.closest('button, a, .box, [role="button"], .fsp-action-btn, .fsp-edge-nav, .fsp-close-btn, .fsp-sound-toggle-btn')) {
        isCursorOverBtn = true;
      }
    });
    window.addEventListener('pointerout', (e) => {
      if (e.target && e.target.closest && e.target.closest('button, a, .box, [role="button"], .fsp-action-btn, .fsp-edge-nav, .fsp-close-btn, .fsp-sound-toggle-btn')) {
        isCursorOverBtn = false;
      }
    });

    // Window resize & orientation change
    window.addEventListener('resize', () => {
      measureDimensions();
      updateChapterIndicator(activeBook);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        measureDimensions();
        updateChapterIndicator(activeBook);
      }, 80);
    });
    if (screen.orientation) {
      screen.orientation.addEventListener('change', () => {
        setTimeout(() => {
          measureDimensions();
          updateChapterIndicator(activeBook);
        }, 80);
      });
    }

    /* --- ANIMATION LOOP (requestAnimationFrame) --- */
    let lastTime = performance.now();

    function loop(now) {
      let dt = (now - lastTime) / 1000;
      if (dt > 0.05) dt = 0.05;
      lastTime = now;

      // 1. Spring physics for s (smooth bounded motion between 0 and 5)
      const k = isDragging ? 18 : (prefersReducedMotion ? 100 : 6.0);
      const prevSVal = s;
      s += (T - s) * (1 - Math.exp(-k * dt));
      if (Math.abs(T - s) < 1e-4) s = T;

      // Track scroll velocity for realistic inertia lean
      scrollVelocity = (s - prevSVal) / (dt || 0.016);

      // 2. Caption update
      const newActive = Math.max(0, Math.min(BOOKS.length - 1, Math.round(s)));
      if (newActive !== activeBook) {
        const dir = Math.sign(T - s) || 1;
        activeBook = newActive;
        updateCaption(activeBook, dir);
        updateChapterIndicator(activeBook);
        updateArrowStates();
      }

      // 3. Cursor smoothing
      cx += (mx - cx) * (1 - Math.exp(-16 * dt));
      cy += (my - cy) * (1 - Math.exp(-16 * dt));
      cursor.style.transform = `translate3d(${cx.toFixed(2)}px, ${cy.toFixed(2)}px, 0)`;

      // 4. Center-based layout calculations for all books
      const rawX = [];
      for (let idx = 0; idx < BOOKS.length; idx++) {
        const r = idx - s;

        // Smooth step B(r) pushes neighbours apart to accommodate the active open cover
        let B;
        if (Math.abs(r) < 1) {
          B = (r + Math.sin(Math.PI * r) / Math.PI) / 2;
        } else {
          B = r > 0 ? 0.5 : -0.5;
        }

        rawX[idx] = r * (ws + gap) + (d - ws + 1.6 * gap) * B;
      }

      // Compute shelf bounds: on mobile center on active book (rawX=0), on desktop center the shelf
      const isMobile = window.innerWidth <= 767;
      const minX = Math.min(...rawX);
      const maxX = Math.max(...rawX);
      const shelfCenterOffset = isMobile ? 0 : (minX + maxX) * 0.5;

      const halfW = window.innerWidth * 0.5;
      const activeX = rawX[activeBook] - shelfCenterOffset;

      // 5. Tilt calculation on active cover
      const isNearCoverX = Math.abs(mx - (halfW + activeX)) <= 0.55 * d;
      const isNearCoverY = Math.abs(my - shelfCenterY) <= 0.55 * H;
      const isSettled = Math.abs(T - s) < 0.3;

      onCover = isNearCoverX && isNearCoverY && !isOpen && isSettled;

      let targetTiltX = 0;
      let targetTiltY = 0;

      if (onCover) {
        targetTiltY = ((mx - (halfW + activeX)) / (0.55 * d)) * 9;
        targetTiltX = -((my - shelfCenterY) / (H * 0.5)) * 6;
      } else {
        targetTiltY = ((mx - halfW) / window.innerWidth) * 5;
        targetTiltX = 0;
      }

      tiltX += (targetTiltX - tiltX) * (1 - Math.exp(-7 * dt));
      tiltY += (targetTiltY - tiltY) * (1 - Math.exp(-7 * dt));

      // 6. Cursor states (supports homepage, detail modal, and full-screen book reader)
      const isReaderActive = window.BookReader && window.BookReader.isOpen;
      cursor.classList.toggle('is-open', onCover && !isOpen && !isReaderActive);
      cursor.classList.toggle('is-spine', isCursorOverSpine && !onCover && !isOpen && !isReaderActive);
      cursor.classList.toggle('is-btn', isCursorOverBtn && !onCover);

      // 7. Play ring position & scale
      const playScale = isOpen ? 0 : smoothstep(Math.max(0, 1 - Math.abs(T - s) * 3));
      let playX = halfW + activeX - 0.5 * d - 6;
      playX = Math.max(20, Math.min(window.innerWidth - 20, playX));
      const playY = Math.max(38, Math.min(window.innerHeight - 38, shelfCenterY + 0.36 * H));
      playRing.style.left = `${playX.toFixed(2)}px`;
      playRing.style.top = `${playY.toFixed(2)}px`;
      playRing.style.transform = `translate(-50%, -50%) scale(${playScale.toFixed(4)})`;
      playRing.style.pointerEvents = (playScale > 0.1 && !isOpen) ? 'auto' : 'none';

      // 8. Dynamic left/right animation of all books (Centered Layout)
      const inertiaZ = Math.max(-4.5, Math.min(4.5, -scrollVelocity * 0.9));

      for (let idx = 0; idx < BOOKS.length; idx++) {
        const tape = tapes[idx];
        const r = idx - s;
        const x = rawX[idx] - shelfCenterOffset;

        // Hover lift
        const isHovered = hoveredIndex === idx && Math.abs(r) > 0.5 && !isOpen;
        const targetLift = isHovered ? 1 : 0;
        const liftRate = prefersReducedMotion ? 1 : (1 - Math.exp(-12 * dt));
        tape.lift += (targetLift - tape.lift) * liftRate;

        // Openness o
        const o = smoothstep(Math.max(0, 1 - Math.abs(r)));

        // 3D transforms
        const rotY = -90 * o + tiltY * o;
        const rotX = tiltX * o;
        const rotZ = (-4.5 * o) + (inertiaZ * (1 - o * 0.7));
        const transZ = o * 0.2 * H;
        const transY = -o * 0.025 * H - tape.lift * 0.045 * H;

        tape.el.style.transform = `translate3d(${x.toFixed(2)}px, ${transY.toFixed(2)}px, ${transZ.toFixed(2)}px) rotateZ(${rotZ.toFixed(2)}deg) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
        tape.el.style.zIndex = Math.round(100 - Math.abs(r) * 12);

        // Dynamic light shading
        tape.sp.style.setProperty('--shade', (o * 0.55).toFixed(3));
        tape.cv.style.setProperty('--shade', ((1 - o) * 0.5).toFixed(3));
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
