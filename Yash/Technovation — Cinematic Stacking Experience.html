<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Technovation — The Networking Club, ABES Engineering College</title>
<meta name="description" content="Technovation, The Networking Club of the CSE Department at ABES Engineering College, Ghaziabad. Networking, cybersecurity and AWS.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b0c;--bone:#ebe7de;--lime:#c8f03c;--red:#ff4630;--teal:#0f2a2b;--mint:#d6efe8;--d:'Syne','Arial Black',Impact,sans-serif;--t:'Instrument Sans',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}body{font-family:var(--t);color:var(--bone);background:var(--ink);overflow-x:hidden}
body::after{content:"";position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.11;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.pn{position:sticky;top:0;height:100vh;height:100svh}
.in{position:relative;height:100%;overflow:hidden;transform-origin:50% 35%;will-change:transform}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
.d{font-family:var(--d);font-weight:800;text-transform:uppercase;line-height:.84;letter-spacing:-.035em;white-space:nowrap}
.k{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.pad{position:absolute;inset:0;padding:clamp(18px,3.4vw,52px)}
/* 0 hero */
.k0{background:var(--ink)}
.k0 h1{position:absolute;left:3vw;bottom:15vh;font-size:min(17.5vw,36vh)}
.k0 h1 span{display:block}.k0 h1 .l2{color:transparent;-webkit-text-stroke:2px var(--bone);margin-left:6vw}
.lt{display:inline-block;transition:translate .25s ease-out}
.k0 .tag{position:absolute;right:4vw;top:16vh;width:min(330px,60vw);font-size:19px;line-height:1.35}
.k0 .tag em{display:block;color:var(--lime);margin-top:12px;font-style:normal;font-weight:700}
.stats{position:absolute;left:3.4vw;right:3.4vw;bottom:3.4vh;display:flex;gap:clamp(18px,4vw,64px);align-items:flex-end;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--d);font-size:clamp(28px,4vw,56px);line-height:1}.stats div span{font-size:12px;color:rgba(235,231,222,.6);letter-spacing:.1em;text-transform:uppercase}
.cta{margin-left:auto;display:inline-grid;place-items:center;padding:20px 30px;background:var(--lime);color:var(--ink);font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:18px;text-decoration:none;will-change:translate}
/* 1 manifesto */
.k1{background:var(--bone);color:var(--ink)}
.k1 .m{position:absolute;left:3.4vw;top:14vh;width:min(560px,86vw);font-size:clamp(20px,2.1vw,30px);line-height:1.25;font-weight:600}
.k1 .m small{display:block;margin-top:20px;font-size:17px;font-weight:400;line-height:1.4;max-width:46ch}
.k1 .w{position:absolute;left:0;right:0;font-size:min(19vw,34vh);white-space:nowrap}
.k1 .w1{bottom:27vh}.k1 .w2{bottom:12vh;color:transparent;-webkit-text-stroke:2px var(--ink)}.k1 .w3{bottom:-3vh;color:var(--red)}
/* 2 net */
.k2{background:var(--teal);color:var(--mint)}
.k2 .rules{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(214,239,232,.1) 0 1px,transparent 1px 9vh)}
.k2 h2{position:absolute;left:-1vw;bottom:-2vh;font-size:min(15.4vw,30vh)}
.k2 .p{position:absolute;right:4vw;top:15vh;width:min(380px,84vw);font-size:20px;line-height:1.4}
/* 3 cyber */
.k3{background:var(--ink)}.k3 h2{position:absolute;left:3vw;top:12vh;font-size:min(14vw,28vh);color:var(--red)}
.k3 .p{position:absolute;left:3.4vw;bottom:9vh;width:min(560px,90vw);font-size:clamp(20px,2vw,28px);line-height:1.5;font-weight:600}
.rd{background:var(--red);color:transparent;transition:.35s;cursor:crosshair;padding:0 .15em}.rd:hover,.rd:focus-visible{background:transparent;color:var(--bone)}
.stamp{position:absolute;right:5vw;bottom:12vh;border:4px solid var(--red);color:var(--red);padding:10px 20px;font-family:var(--d);font-weight:800;font-size:clamp(28px,5vw,64px);rotate:-9deg;text-transform:uppercase}
/* 4 aws */
.k4{background:var(--lime);color:var(--ink)}.k4 h2{position:absolute;right:-3vw;bottom:-9vh;font-size:min(52vw,92vh);line-height:.7}
.k4 .p{position:absolute;left:3.4vw;top:14vh;width:min(400px,86vw);font-size:22px;line-height:1.35;font-weight:600}.k4 .p b{display:block;margin-top:18px;font-family:var(--d);font-size:26px;text-transform:uppercase;line-height:1.1}
/* flagships */
.fl{position:absolute;inset:0}.fl .no{position:absolute;left:3.4vw;top:14vh}
.fl .nm{position:absolute;font-size:min(13.5vw,26vh)}
.fl .bl{position:absolute;left:3.4vw;bottom:5vh;width:min(420px,84vw);font-size:19px;line-height:1.4}
.fl .det{position:absolute;right:0;top:0;bottom:0;width:min(380px,84vw);padding:14vh 28px 28px;translate:100% 0;transition:translate .55s cubic-bezier(.2,.8,.2,1);font-size:17px;line-height:1.5;z-index:5}
.fl:hover .det,.fl:focus-within .det,.fl.open .det{translate:0 0}
.det b{display:block;font-family:var(--d);text-transform:uppercase;font-size:28px;margin-bottom:12px;line-height:1}.det p{margin-bottom:12px}
.fl .hint{position:absolute;right:3.4vw;bottom:5vh;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.k5{background:var(--bone);color:var(--ink)}.k5 .nm{left:3.2vw;top:26vh}.k5 .det{background:var(--ink);color:var(--bone)}
.keys{position:absolute;left:3.4vw;right:3.4vw;top:58vh;display:flex;flex-wrap:wrap;gap:6px}
.keys i{font-style:normal;font-family:var(--d);font-weight:800;width:clamp(26px,4.2vw,58px);height:clamp(26px,4.2vw,58px);display:grid;place-items:center;border:2px solid var(--ink);font-size:clamp(11px,1.6vw,22px);transition:transform .2s,background .2s}.keys i:hover{transform:translateY(-8px);background:var(--ink);color:var(--bone)}
.caret{display:inline-block;width:.09em;height:.8em;background:var(--red);vertical-align:baseline;margin-left:.04em;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.k6{background:var(--red);color:var(--ink)}.k6 .nm{left:3vw;top:20vh;font-size:min(11.2vw,22vh)}.k6 .nm span{display:block}.k6 .nm .o{color:transparent;-webkit-text-stroke:2px var(--ink);margin-left:8vw}
.rnd{position:absolute;left:3.4vw;top:56vh;display:flex;gap:2vw;font-family:var(--d);font-weight:800;font-size:clamp(20px,3vw,40px)}.rnd span{border-top:4px solid var(--ink);padding-top:6px}
.k6 .det{background:var(--ink);color:var(--bone)}.k6 .bl{bottom:5vh;left:auto;right:3.4vw;top:auto;text-align:right}
.k6 .hint{bottom:auto;top:14vh}.k7{background:#17171a}.k7 .nm{left:3vw;font-size:min(15vw,28vh);transition:translate .4s}.k7 .nm.a{top:12vh;opacity:.18}.k7 .nm.b{top:24vh;opacity:.38;margin-left:3vw}.k7 .nm.c{top:36vh;opacity:.65;margin-left:6vw}.k7 .nm.e{top:48vh;margin-left:9vw;color:var(--lime)}
.k7:hover .nm.a{translate:-3vw 0}.k7:hover .nm.c{translate:3vw 0}.k7 .det{background:var(--lime);color:var(--ink)}.k7 .bl{bottom:5vh}
/* archive */
.k8{background:var(--ink)}.k8 .pad{padding-top:12vh;overflow:auto}
.ar{display:block;width:100%;border-top:1px solid rgba(235,231,222,.25);padding:clamp(10px,1.8vh,20px) 0;transition:padding .35s,color .25s}
.ar .row{display:flex;gap:3vw;align-items:baseline;justify-content:space-between}.ar .d{font-size:clamp(26px,5.2vw,78px);white-space:normal;transition:translate .35s}
.ar:hover .d,.ar[aria-expanded=true] .d{translate:2vw 0;color:var(--lime)}.ar .dt{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-align:right;flex:none}
.ar .more{max-height:0;overflow:hidden;transition:max-height .5s;font-size:18px;line-height:1.45;max-width:62ch;color:rgba(235,231,222,.75)}.ar[aria-expanded=true] .more{max-height:200px;padding-top:12px}
.ar.tz{color:var(--red);cursor:default}.ar.tz .d{animation:bl 1.4s steps(1) infinite}
/* people */
#people{height:480vh;position:relative}#people .in{position:sticky;top:0;height:100vh;height:100svh;background:var(--ink)}
.flt{position:absolute;left:3.4vw;top:12vh;z-index:6;display:flex;flex-direction:column;gap:2px}.flt h2{font-size:clamp(30px,3.6vw,52px);margin-bottom:14px;color:var(--lime)}
.flt button{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:6px 0;color:rgba(235,231,222,.55);transition:.2s}.flt button:hover,.flt button.on{color:var(--bone);padding-left:10px;box-shadow:inset 3px 0 var(--lime)}
.ll{position:absolute;left:min(22vw,230px);right:0;top:14vh;padding-right:3vw;will-change:transform}
.gl{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin:3.5vh 0 .8vh}
.pp{display:block;font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:clamp(46px,9vw,150px);line-height:.76;letter-spacing:-.04em;transition:translate .35s,opacity .25s,color .2s;white-space:nowrap;padding:.04em 0}
.ll:hover .pp:not(:hover){opacity:.22}.pp:hover,.pp:focus-visible{translate:2.5vw 0;color:var(--lime)}
@media(max-width:760px){.flt{flex-direction:row;flex-wrap:wrap;gap:4px 14px;left:4vw;right:4vw;top:9vh}.flt h2{display:none}.ll{left:4vw;top:22vh}.pp{font-size:15vw}}
/* faq/join */
#end{position:relative;margin-top:-100vh;margin-top:-100svh;height:auto;min-height:100vh;z-index:5;background:var(--bone);color:var(--ink)}
#end .in{height:auto;min-height:100vh;overflow:visible;padding:clamp(20px,4vw,60px);display:grid;grid-template-columns:1.05fr 1fr;gap:5vw}
#end h2{font-size:min(17vw,30vh)}
details{border-top:2px solid var(--ink);padding:14px 0}summary{cursor:pointer;list-style:none;font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:clamp(22px,3vw,40px);line-height:1;letter-spacing:-.02em;transition:translate .3s}summary::-webkit-details-marker{display:none}summary:hover,details[open] summary{translate:12px 0;color:var(--red)}
details p{font-size:19px;line-height:1.45;margin-top:10px;max-width:50ch}
.big{display:inline-grid;place-items:center;margin:26px 0;padding:26px 36px;background:var(--ink);color:var(--lime);font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:22px;text-decoration:none;will-change:translate}
.ft{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px}.ft a{font-weight:700;font-size:15px;text-underline-offset:5px}.ft a:hover{color:var(--red)}
@media(max-width:860px){#end .in{grid-template-columns:1fr}}
/* chrome */
#brand{position:fixed;left:18px;top:14px;z-index:60;display:flex;gap:10px;align-items:center;font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:15px;text-decoration:none;mix-blend-mode:difference;color:#fff}#brand img{width:28px}
#idx{position:fixed;right:18px;top:14px;z-index:60;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;padding:6px 0}
#cnt{position:fixed;right:18px;bottom:14px;z-index:60;font-family:var(--d);font-weight:800;font-size:15px;mix-blend-mode:difference;color:#fff}
#menu{position:fixed;inset:0;z-index:80;background:var(--lime);color:var(--ink);padding:14vh 5vw;display:flex;flex-direction:column;justify-content:center;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .6s cubic-bezier(.7,0,.2,1),visibility 0s .6s}
#menu.open{clip-path:inset(0);visibility:visible;transition:clip-path .6s cubic-bezier(.7,0,.2,1)}
#menu button{font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:clamp(34px,8vw,110px);line-height:.95;letter-spacing:-.03em;transition:translate .3s}#menu button:hover{translate:2vw 0;color:var(--red)}
#menu .x{position:absolute;right:18px;top:14px;font-size:13px;font-family:var(--t);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
#cd,#cr{position:fixed;left:0;top:0;z-index:99;pointer-events:none;border-radius:50%}#cd{width:7px;height:7px;margin:-3px 0 0 -3px;background:#fff;mix-blend-mode:difference}
#cr{width:36px;height:36px;margin:-18px 0 0 -18px;border:1px solid #fff;mix-blend-mode:difference;display:grid;place-items:center;transition:width .3s,height .3s,margin .3s,background .3s}
#cr.h{width:84px;height:84px;margin:-42px 0 0 -42px;background:#fff}#cr span{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#000;opacity:0;white-space:nowrap;transition:.2s}#cr.h span{opacity:1}
@media(hover:none){#cd,#cr{display:none}}
/* profile */
#md{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:rgba(5,5,5,.78);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;padding:14px;perspective:1400px}
#md.open{opacity:1;visibility:visible;transition:opacity .3s}
#card{position:relative;width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--bone);color:var(--ink);display:grid;grid-template-columns:.8fr 1.4fr;transition:transform .15s;transform-style:preserve-3d;box-shadow:0 40px 120px rgba(0,0,0,.6)}
#card .art{background:var(--ink);color:var(--lime);display:flex;flex-direction:column;justify-content:space-between;padding:20px;min-height:260px;overflow:hidden}#card .art .d{font-size:min(30vw,220px);line-height:.8;translate:0 0}
#card .art span{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone)}
#card .bd{padding:28px}#card h3{font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:clamp(34px,5vw,64px);line-height:.88;letter-spacing:-.03em}
#card .rl{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;margin:10px 0 14px;color:#5a5a55}#card .tg{font-family:var(--d);font-size:22px;line-height:1.1;margin-bottom:12px}#card p{font-size:16px;line-height:1.5}
#card dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:18px 0}#card dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5a5a55}#card dd{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}.chips i{font-style:normal;font-weight:600;font-size:13px;border:1.5px solid var(--ink);padding:3px 9px}
#card .ph{font-size:12px;color:#5a5a55;margin-top:16px}#cl{position:absolute;right:12px;top:10px;z-index:3;background:var(--ink);color:var(--bone);padding:8px 14px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:700px){#card{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

pn('k8',`<div class="pad"><span class="k" style="color:var(--lime)">Archive · workshops &amp; contests</span><div style="margin-top:2vh">${ARCH.map((a,i)=>`<button class="ar" aria-expanded="false" data-cur="Open"><span class="row"><span class="d">${a[0]}</span><span class="dt">${a[1]}</span></span><span class="more" style="display:block">${a[2]}</span></button>`).join('')}<div class="ar tz"><span class="row"><span class="d">Classified: next mission loading</span></span></div></div></div>`)+
`<section class="pn" id="people" aria-label="People"><div class="in"><div class="flt" id="flt"><h2 class="d">People<br>44</h2></div><div class="ll" id="ll"></div><div class="dim"></div></div></section>`+
`<section class="pn" id="end" aria-label="FAQ and join"><div class="in"><div><h2 class="d">Join<br>us.</h2><p style="font-size:20px;line-height:1.4;max-width:34ch;font-weight:600">Open to all B.Tech branches, with a focus on 1st and 2nd year students. Applications are by email for now; a form is coming later.</p><a class="big mag" href="mailto:${CLUB.email}?subject=Join%20the%20mission" data-cur="Email">Join the mission</a><div class="ft"><a href="mailto:${CLUB.email}">${CLUB.email}</a>${CLUB.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('')}</div></div>
<div style="padding-top:2vh"><details open><summary>Who can join?</summary><p>All B.Tech branches are welcome. We focus on 1st and 2nd year students.</p></details><details><summary>When does recruitment happen?</summary><p>Once a year, online, at the end of June. The core team runs it with our faculty coordinator.</p></details><details><summary>Which departments exist?</summary><p>${DEPTS.join(', ')}.</p></details><details><summary>How do I contact you?</summary><p>Email ${CLUB.email} or message us on Instagram, LinkedIn, Facebook or X.</p></details></div></div><div class="dim"></div></section>`;
/* wrap people & end into .pn structure expectations */
const PN=$$('.pn');PN.forEach(p=>{p._in=$('.in',p);p._dim=$('.dim',p);p._par=$$('[data-sx],[data-sy]',p)});
/* people */
const fl2=['All','Core Board',...DEPTS],flt=$('#flt'),ll=$('#ll');let filt='All';
fl2.forEach(f=>{const n=f==='All'?PEOPLE.length:f==='Core Board'?PEOPLE.filter(p=>p.core).length:PEOPLE.filter(p=>p.dept===f).length;const b=document.createElement('button');b.innerHTML=`${esc(f)} <span style="opacity:.5">${n}</span>`;b.onclick=()=>{filt=f;render()};b.dataset.f=f;flt.append(b)});
function render(){$$('button',flt).forEach(b=>b.classList.toggle('on',b.dataset.f===filt));let list=filt==='All'?PEOPLE:filt==='Core Board'?PEOPLE.filter(p=>p.core):PEOPLE.filter(p=>p.dept===filt);let h='',g='';
 list.forEach(p=>{const grp=filt==='All'?(p.core?'Core Board and leads':p.dept):(filt==='Core Board'?'Core Board and leads':p.dept);if(grp!==g){g=grp;h+=`<div class="gl">${esc(g)}</div>`}h+=`<button class="pp" data-i="${PEOPLE.indexOf(p)}" data-cur="${esc(p.role)}">${esc(p.name)}</button>`});ll.innerHTML=h}
render();
/* profile */
const md=$('#md'),card=$('#card');let opener=null;
const fld=(k,v)=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`;
function openP(i,el){const p=PEOPLE[i];opener=el;$('#pi').textContent=p.name[0];$('#pd').textContent=p.dept;$('#pn').textContent=p.name;$('#pr').textContent=p.role+' · '+p.dept;$('#pt').textContent=p.tag;$('#pb').textContent=p.bio;$('#pf').innerHTML=fld('Year',p.year)+fld('Branch',p.branch)+fld('Joined',p.joined)+fld('Favourite tool',p.tool);$('#ps').innerHTML=p.skills.map(s=>`<i>${esc(s)}</i>`).join('');$('#pe').innerHTML=p.ev.map(s=>`<i>${s}</i>`).join('');$('#pu').textContent=p.fun;md.classList.add('open');md.setAttribute('aria-hidden','false');$('#cl').focus()}
function closeP(){md.classList.remove('open');md.setAttribute('aria-hidden','true');opener&&opener.focus()}
ll.onclick=e=>{const b=e.target.closest('.pp');if(b)openP(+b.dataset.i,b)};$('#cl').onclick=closeP;md.onclick=e=>{if(e.target===md)closeP()};
addEventListener('keydown',e=>{if(e.key==='Escape'){closeP();menuT(false)}if(e.key==='Tab'&&md.classList.contains('open')){e.preventDefault();$('#cl').focus()}});
md.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`rotateY(${x*6}deg) rotateX(${-y*6}deg)`;$('#pi').style.translate=`${x*-24}px ${y*-24}px`});
/* archive + flagship touch */
$$('.ar[aria-expanded]').forEach(b=>b.onclick=()=>b.setAttribute('aria-expanded',b.getAttribute('aria-expanded')!=='true'));
$$('.fl').forEach(f=>f.addEventListener('click',()=>f.classList.toggle('open')));
/* chapters / menu */
const CH=[['Enter',0],['Manifesto',1],['Domains',2],['Flagships',5],['Archive',8],['People',9],['Join',10]],menu=$('#menu');
CH.forEach(c=>{const b=document.createElement('button');b.textContent=c[0];b.onclick=()=>{menuT(false);scrollTo({top:starts[c[1]],behavior:'smooth'})};menu.append(b)});
function menuT(o){menu.classList.toggle('open',o);$('#idx').setAttribute('aria-expanded',o);if(o)$('#mx').focus()}
$('#idx').onclick=()=>menuT(!menu.classList.contains('open'));$('#mx').onclick=()=>menuT(false);
let starts=[],vh=innerHeight;
function meas(){vh=innerHeight;let pos=0;starts=PN.map(p=>{const mt=parseFloat(getComputedStyle(p).marginTop)||0;pos+=mt;const s=pos;pos+=p.offsetHeight;return s})}
addEventListener('resize',meas);addEventListener('load',meas);meas();document.fonts&&document.fonts.ready.then(meas);
/* cursor + magnet + letters */
const cd=$('#cd'),cr=$('#cr'),crl=$('#crl'),mags=$$('.mag'),lts=$$('.lt');let mx=-999,my=-999,rx=-999,ry=-999;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;cd.style.transform=`translate(${mx}px,${my}px)`;const t=e.target.closest('[data-cur],a,button,summary,.rd');cr.classList.toggle('h',!!t);crl.textContent=t&&t.dataset.cur?t.dataset.cur:''});
(function loop(){rx+=(mx-rx)*.2;ry+=(my-ry)*.2;cr.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop)})();
const cl=v=>Math.max(0,Math.min(1,v)),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(){
 PN.forEach((p,i)=>{const r=p.getBoundingClientRect(),e=cl(r.top/vh),nx=PN[i+1],q=nx?1-cl(nx.getBoundingClientRect().top/vh):0,n=p._in;
  n.style.clipPath=e>.001?`polygon(0 ${(e*16).toFixed(2)}vh,100% 0,100% 100%,0 100%)`:'none';
  n.style.transform=q>0&&!RM?`perspective(1400px) translateY(${(-q*4).toFixed(2)}vh) scale(${(1-.09*q).toFixed(4)}) rotateX(${(q*3).toFixed(2)}deg)`:'none';
  n.style.filter=q>0&&q<1&&!RM?`blur(${(q*4).toFixed(1)}px)`:'none';n.style.visibility=q>=1&&nx.getBoundingClientRect().top<=0?'hidden':'visible';n.inert=q>.6;p._dim.style.opacity=(q*.7).toFixed(2);
  if(!RM)p._par.forEach(el=>{const sx=+el.dataset.sx||0,sy=+el.dataset.sy||0;el.style.translate=`${(e*sx-q*sx*.35).toFixed(1)}px ${(e*sy-q*sy*.35).toFixed(1)}px`})});
 const pr=$('#people').getBoundingClientRect(),t=cl(-pr.top/(pr.height-vh));ll.style.transform=`translateY(${-t*Math.max(0,ll.offsetHeight-vh*.72)}px)`;
 lts.forEach(l=>{const b=l.getBoundingClientRect(),d=Math.hypot(mx-(b.left+b.width/2),my-(b.top+b.height/2)),f=cl(1-d/260);l.style.translate=RM?'0 0':`0 ${(-f*f*40).toFixed(1)}px`});
 mags.forEach(m=>{const b=m.getBoundingClientRect(),dx=mx-(b.left+b.width/2),dy=my-(b.top+b.height/2),d=Math.hypot(dx,dy);m.style.translate=d<b.width*.8&&!RM?`${dx*.25}px ${dy*.25}px`:'0 0'});
 let ci=0;starts.forEach((s,i)=>{if(scrollY>=s-vh*.45)ci=i});$('#cnt').textContent=String(ci+1).padStart(2,'0')+' / '+PN.length;
 requestAnimationFrame(frame)}
frame();
</script></body></html>
