<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Technovation, the Networking Club | ABES Engineering College</title>
<meta name="description" content="Technovation is the networking club of the CSE department at ABES Engineering College, Ghaziabad.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Hanken+Grotesk:wght@400;500;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a1a4a;--pp:#fffdf7;--or:#ff6a1f}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:17px/1.6 'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--ink)}
h1,h2,h3,.dsp{font-family:'Anybody','Arial Black',sans-serif;font-weight:800;font-variation-settings:'wdth' 100;line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
a{color:inherit}
main{position:relative}
.tab{position:sticky;top:calc(var(--i)*36px);z-index:calc(10 + var(--i));height:36px;display:flex;align-items:center;gap:10px;padding:0 4vw;background:var(--c);border-bottom:2px solid var(--ink);text-decoration:none;font-weight:700;font-size:.86rem;color:var(--ink)}
.tab b{font:900 1rem 'Anybody'}.tab i{margin-left:auto;font-style:normal;opacity:.75}.tab svg{width:18px}
.bd{background:var(--c);padding:9vh 4vw 12vh;min-height:calc(100svh - var(--n)*36px);position:relative;overflow:hidden;scroll-margin-top:calc(var(--n)*36px)}
.w{color:#fff}.w .cdw{color:var(--ink)}
.nm{position:absolute;right:2vw;top:5vh;font:900 clamp(10rem,30vw,28rem)/.8 'Anybody';-webkit-text-stroke:2px var(--ink);color:transparent;opacity:.28;pointer-events:none}
.w .nm{-webkit-text-stroke-color:#fff}
.in{position:relative;max-width:1150px}
h2{font-size:clamp(2.8rem,8.5vw,7.4rem);margin-bottom:3vh}
.lead{font-size:1.2rem;max-width:32em;margin-bottom:26px}
.big{font:700 clamp(1.6rem,3.8vw,3.2rem)/1.12 'Anybody';text-transform:none;max-width:22em;letter-spacing:-.01em;font-variation-settings:'wdth' 85}
.btn{display:inline-block;background:var(--ink);color:#fff;font:800 1rem 'Hanken Grotesk';text-decoration:none;padding:15px 28px;border-radius:99px;border:2px solid var(--ink);transition:transform .15s}
.btn:hover{transform:translateY(-3px)}.btn.g{background:transparent;color:var(--ink)}.btn.o{background:var(--or);color:var(--ink)}.w .btn.g{color:#fff;border-color:#fff}
.acts{display:flex;gap:12px;flex-wrap:wrap}
#hl{font-size:clamp(4.4rem,17vw,17rem);font-weight:900;display:flex;flex-direction:column;margin:3vh 0 4vh}
#coin{position:absolute;right:3vw;top:9vh;width:min(36vw,400px);height:min(36vw,400px);pointer-events:none}
.vis{display:flex;flex-wrap:wrap;gap:6px 36px;margin-top:6vh;font:900 clamp(2.4rem,7vw,6rem) 'Anybody';text-transform:uppercase}.vis span{-webkit-text-stroke:2px var(--ink);color:transparent}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.cdw{background:var(--pp);border:2px solid var(--ink);border-radius:22px;padding:28px;transition:transform .2s,box-shadow .2s}
.cdw:hover{transform:translate(-4px,-4px);box-shadow:8px 8px 0 var(--ink)}
.cdw svg{width:64px;height:64px;margin-bottom:14px;fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.cdw h3{font-size:2.1rem;margin-bottom:10px}.cdw .lb{font:700 .78rem 'Hanken Grotesk';letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.tg{display:inline-block;margin-top:12px;font-weight:700;font-size:.82rem;background:#fff1e8;color:#b8460f;padding:4px 12px;border-radius:99px}
.rw{display:grid;grid-template-columns:130px 1fr auto;gap:4px 18px;padding:16px 4px;border-top:2px solid var(--ink)}.rw:last-child{border-bottom:2px solid var(--ink)}.rw b{font:800 1.3rem 'Anybody';text-transform:uppercase}.rw p{grid-column:2/4;font-size:.95rem;opacity:.8}
h3.sh2{font-size:1.9rem;margin:6vh 0 14px}
.cb{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.chip{background:var(--pp);border:2px solid var(--ink);border-left:12px solid var(--k);border-radius:14px;padding:11px 14px;color:var(--ink)}.chip b{display:block;font:800 1.25rem 'Anybody';text-transform:uppercase}.chip span{font-size:.86rem;opacity:.7}
.dp h3{font-size:1.6rem;padding-bottom:8px;margin-bottom:8px;border-bottom:6px solid var(--k)}.dp small{display:block;opacity:.7;margin-bottom:8px}.dp ul{list-style:none;padding:0}.dp li{padding:5px 0;border-top:1px dashed rgba(10,26,74,.3)}
details{border-top:2px solid var(--ink);padding:18px 2px;max-width:46em}details:last-child{border-bottom:2px solid var(--ink)}
summary{font:800 1.2rem 'Anybody';text-transform:uppercase;cursor:pointer;list-style:none;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary::after{content:'+';font-size:1.6rem;line-height:1;transition:transform .25s}details[open] summary::after{transform:rotate(45deg)}details p{margin-top:8px;max-width:36em}
.jn h2{font-size:clamp(3.4rem,13vw,12rem)}.jn .fl{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:8vh;opacity:.85}
#pk{position:fixed;left:3vw;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:12px;background:var(--pp);border:2px solid var(--ink);border-radius:16px;padding:6px 14px 6px 6px;font-weight:700;font-size:.82rem;max-width:calc(100vw - 100px)}
.sh{display:flex;align-items:center;gap:5px;padding:4px 5px 4px 7px;border-radius:10px;background:var(--c);border:2px solid var(--ink);animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.75)}}.sh em{font:900 .78rem 'Anybody';font-style:normal}.dt{background:var(--pp);color:var(--ink);padding:3px 6px;border-radius:6px;font-size:.7rem;border:1.5px solid var(--ink)}
#jp{position:fixed;right:3vw;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;padding:12px 22px;background:var(--or);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}.w a:focus-visible,.w summary:focus-visible{outline-color:#fff}
@media(max-width:700px){.tab{top:0!important;height:40px}.bd{scroll-margin-top:40px;min-height:calc(100svh - 40px)}#coin{opacity:.9;top:6vh;width:44vw;height:44vw}.rw{grid-template-columns:1fr}.rw p{grid-column:1}#pk{font-size:.74rem}.tab i{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style></head>
<body>
<main id="mn"></main>
<div id="pk" aria-hidden="true"><div id="pkb"></div><span id="pkn"></span></div>
<a id="jp" class="btn" href="#b6">Join</a>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],RM=matchMedia('(prefers-reduced-motion:reduce)').matches,cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
// ---- DATA: edit here ----
const CORE=[["Shresth","General Secretary"],["Ayush","Joint Secretary"],["Chaitanya","Joint Secretary"],["Lavi","Treasurer"],["Yash","Technical Lead"],["Shruti","Technical Lead"],["Anuj","Graphics Lead"],["Anushka","Graphics Lead"],["Zeeshan","Production Lead"],["Juwairiyah","Content Lead"],["Gudiya","Events Lead"],["Aditya","Events Lead"],["Kaushiki","PR & Outreach Lead"],["Harshvardhan","PR & Outreach Lead"]];
const TEAMS=[
["Technical","#4f93e0",["Yash","Shruti"],["Dishant Ghalot","Vadanta Kumar Chauhaan","Aditya Dubey","Samarth Verma","Harsh Tiwari"]],
["Events","#f47c3c",["Gudiya","Aditya"],["Aryan Jha","Tushti Gupta","Shrishti Gupta","Gauri Jain","Satyam Shukla"]],
["PR & Outreach","#2fd69a",["Kaushiki","Harshvardhan"],["Sanskriti Pandey","Neha Gupta","Samriddhi Johri","Saavya Singh","Sakshi Yadav"]],
["Graphics","#ff5fb0",["Anuj","Anushka"],["Ridah Abbasi","Ananya Singh","Anshita Garg","Shifa Saifi","Aaniya Singh"]],
["Content","#ffd23f",["Juwairiyah"],["Shreya Shekhar","Aalia Idris","Arush Dixit","Pari","Manasvi Singh"]],
["Production","#b693ff",["Zeeshan"],["Aaryan Vashishta","Tripti Sahani","Smriti Patel","Ankit","Manas Kumar"]]];
const FLAG=[["TypoBuzz","Typing and tech-trivia showdown with a live leaderboard.","Details to confirm","f1"],["CyberQuest","Cybersecurity quest of puzzles and CTF-style challenges in timed rounds.","Details to confirm","f2"],["Vertigo","Our annual signature tech celebration with contests, talks and showcases.","Details to confirm","f3"]];
const LOG=[["Mar 2019","Git & GitHub Workshop","Workshop","Two days, sponsored by GitHub."],["Mar 2019","Coding Contest + C++ Workshop","Contest","Sponsored by GitHub, with a speaker from GitHub Campus Experts."],["15 Apr 2019","Web Development Workshop","Workshop","Sponsored by GitHub Education."],["Date TBA","Quantum Computing Workshop","5 days","Placeholder: qubits to circuits on a simulator, hands-on daily."],["Classified","Next mission","Incoming","Signal not yet decoded."]];

const CASE='https://claude.ai/artifact/DTUhA1U96zA6FbG2rtWYb2';
const LY=[['7','Application','#ff6a1f','The club'],['6','Presentation','#ffd23f','About'],['5','Session','#2fd69a','Domains'],['4','Transport','#4f93e0','Events'],['3','Network','#ff5fb0','Team'],['2','Data link','#b693ff','FAQ'],['1','Physical','#0a1a4a','Join']];
const MARK='<svg viewBox="228 229 201 192" aria-hidden="true"><path fill="#1f5a96" d="M232 233h55v184h-55zM232 233h55l138 184h-55zM370 340h55v77h-55z"/><path fill="#ff6a1f" d="M352 233h73v87z"/></svg>';
const IC=['<svg viewBox="0 0 64 64"><path d="M18 46a12 12 0 0 1 2-23 16 16 0 0 1 30 4 10 10 0 0 1-2 19z"/></svg>','<svg viewBox="0 0 64 64"><path d="M32 8l20 7v15c0 13-9 22-20 26C21 52 12 43 12 30V15z"/><path d="M22 32l8 8 13-15"/></svg>','<svg viewBox="0 0 64 64"><path d="M32 32L12 14M32 32l22-16M32 32l18 22M32 32L14 52"/><circle cx="32" cy="32" r="6"/><circle cx="12" cy="14" r="4"/><circle cx="54" cy="16" r="4"/><circle cx="50" cy="54" r="4"/><circle cx="14" cy="52" r="4"/></svg>'];
const DOM=[['AWS','Cloud from the ground up: compute, storage and networking, deployed hands-on.'],['Cyber Security','Think like an attacker, build like a defender. Challenges and CTF-style rounds.'],['Networking','How data really moves between machines, and how to design the networks it travels on.']];
const col=r=>(TEAMS.find(t=>r.includes(t[0]))||[0,'#8aa4ff'])[1];
const BODY=[
`<div class="in"><canvas id="coin" aria-hidden="true" width="400" height="400"></canvas><h1 id="hl"><span>Techno</span><span>vation</span></h1><p class="lead">The Networking Club of the CSE department at ABES Engineering College, Ghaziabad. Where connections spark innovation and technology bridges every gap.</p><div class="acts"><a class="btn" href="#b6">Join the mission</a><a class="btn g" href="${CASE}">Explore the case file</a></div><p style="margin-top:6vh;max-width:30em;font-weight:700">Scroll down: you are a data packet. Watch it get wrapped layer by layer in the box at the bottom left.</p></div>`,
`<div class="in"><p class="big">We are students who care about networking, cybersecurity and real-world problem solving. We design networks, host security challenges and learn by building, breaking and fixing things together.</p><div class="vis"><span>Collaborate</span><span>Connect</span><span>Grow</span></div></div>`,
`<div class="in"><h2>Our domains</h2><p class="lead">Three areas we go deep on. Descriptions are draft copy until the team confirms them.</p><div class="grid">${DOM.map((d,i)=>`<div class="cdw">${IC[i]}<h3>${d[0]}</h3><p>${d[1]}</p></div>`).join('')}</div></div>`,
`<div class="in"><h2>Flagship events</h2><div class="grid">${FLAG.map(f=>`<div class="cdw"><p class="lb">Flagship</p><h3>${f[0]}</h3><p>${f[1]}</p><span class="tg">${f[2]}</span></div>`).join('')}</div><h3 class="sh2">Mission log</h3>${LOG.map(r=>`<div class="rw"><span>${r[0]}</span><b>${r[1]}</b><span>${r[2]}</span><p>${r[3]}</p></div>`).join('')}</div>`,
`<div class="in"><h2>The people</h2><p class="lead">44 people: the core board, then six departments of five members each.</p><div class="cb">${CORE.map(c=>`<div class="chip" style="--k:${col(c[1])}"><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div><h3 class="sh2">Departments</h3><div class="grid">${TEAMS.map(t=>`<div class="cdw dp" style="--k:${t[1]}"><h3>${t[0]}</h3><small>Led by ${t[2].join(' and ')}</small><ul>${t[3].map(m=>`<li>${m}</li>`).join('')}</ul></div>`).join('')}</div></div>`,
`<div class="in"><h2>Questions</h2><details><summary>Who can join?</summary><p>Students from all B.Tech branches. We focus on 1st and 2nd year students.</p></details><details><summary>When is recruitment?</summary><p>Online, once a year at the end of June, run by the core team with our faculty coordinator.</p></details><details><summary>Which departments are there?</summary><p>Technical, Events, PR and Outreach, Graphics, Content and Production.</p></details><details><summary>How do I contact the club?</summary><p><a href="mailto:abes.technovation@gmail.com">abes.technovation@gmail.com</a></p></details></div>`,
`<div class="in jn"><h2>Ready, agent?</h2><p class="lead">Open to all B.Tech branches. Recruitment runs online at the end of June. Write to us and get on the list.</p><div class="acts"><a class="btn o" href="mailto:abes.technovation@gmail.com?subject=Join%20Technovation">Email the club</a><a class="btn g" href="${CASE}">Explore the case file</a></div><div class="fl"><a href="https://www.abes.ac.in/Technovation.html">College page</a><a href="https://www.instagram.com/technovationabes">Instagram</a><a href="https://www.linkedin.com/company/the-networking-club-abesec/">LinkedIn</a><a href="https://www.facebook.com/abestechnovation/">Facebook</a><a href="https://twitter.com/technovationcse">X</a></div></div>`];
$('#mn').innerHTML=LY.map((l,i)=>`<a class="tab${i==6?' w':''}" style="--i:${i};--c:${l[2]}" href="#b${i}">${i==0?MARK:''}<b>L${l[0]}</b>${i==0?'Technovation':l[1]}<i>${i==0?'Application, the club':l[3]}</i></a><section class="bd${i==6?' w':''}" id="b${i}" style="--c:${l[2]};--n:${i+1}">${i?`<div class="nm" aria-hidden="true">${l[0]}</div>`:''}${BODY[i]}</section>`).join('');
// ---- packet HUD: encapsulation as you scroll ----
let cur=-1;const BD=$$('.bd');
function hud(k){let h='<span class="dt">data</span>';for(let i=0;i<=k;i++)h=`<div class="sh" style="--c:${LY[i][2]};color:${i==6?'#fff':'#0a1a4a'}"><em>${LY[i][0]}</em>${h}</div>`;$('#pkb').innerHTML=h;$('#pkn').textContent=`Layer ${LY[k][0]}, ${LY[k][1]}`;$('#jp').style.display=k==6?'none':''}
hud(0);
// ---- 3D logo coin ----
let RC,S,C,B,mx=0,my=0,px=0,py=0,moved=0;
try{
RC=new THREE.WebGLRenderer({canvas:$('#coin'),alpha:true,antialias:true});RC.setSize(400,400,false);
S=new THREE.Scene();C=new THREE.PerspectiveCamera(30,1,.1,100);C.position.z=18;
S.add(new THREE.AmbientLight(0xffffff,.85));const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(3,5,8);S.add(dl);
const cv=document.createElement('canvas');cv.width=cv.height=1024;const TEX=new THREE.CanvasTexture(cv);
const drawTex=()=>{const x=cv.getContext('2d');x.clearRect(0,0,1024,1024);x.save();x.translate(512,512);x.strokeStyle='#000';x.fillStyle='#000';x.lineWidth=9;x.beginPath();x.arc(0,0,495,0,7);x.stroke();
x.font='700 88px Unbounded,Arial Black,sans-serif';x.textAlign='center';x.textBaseline='middle';const st=.2;
'TECHNOVATION'.split('').forEach((c,i,a)=>{x.save();x.rotate(-Math.PI/2+(i-(a.length-1)/2)*st+Math.PI/2);x.fillText(c,0,-395);x.restore()});
'NETWORKING CLUB'.split('').forEach((c,i,a)=>{x.save();x.rotate(Math.PI/2-(i-(a.length-1)/2)*st-Math.PI/2);x.fillText(c,0,395);x.restore()});
[-1,1].forEach(s=>{x.beginPath();x.arc(s*420,0,24,0,7);x.fill()});x.restore();TEX.needsUpdate=true};
drawTex();if(document.fonts)document.fonts.load('700 88px Unbounded').then(drawTex);
const shp=a=>{const s=new THREE.Shape();a.forEach(([x,y],i)=>{const X=(x-327)*.0105,Y=-(y-325)*.0105;i?s.lineTo(X,Y):s.moveTo(X,Y)});return s};
B=new THREE.Group();
const ex=(a,c,d)=>{const m=new THREE.Mesh(new THREE.ExtrudeGeometry(shp(a),{depth:d,bevelEnabled:true,bevelThickness:.04,bevelSize:.03,bevelSegments:2}),new THREE.MeshStandardMaterial({color:c,roughness:.4,metalness:.1}));m.position.z=.2;B.add(m)};
const disc=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,.34,72),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}));disc.rotation.x=Math.PI/2;B.add(disc);
B.add(new THREE.Mesh(new THREE.TorusGeometry(3.2,.1,12,90),new THREE.MeshStandardMaterial({color:0x0b0b0b})));
const face=new THREE.Mesh(new THREE.CircleGeometry(3.15,64),new THREE.MeshBasicMaterial({map:TEX,transparent:true}));face.position.z=.18;B.add(face);
ex([[232,233],[287,233],[287,417],[232,417]],0x1f5a96,.5);ex([[232,233],[287,233],[425,417],[370,417]],0x1f5a96,.5);ex([[370,340],[425,340],[425,417],[370,417]],0x1f5a96,.5);ex([[352,233],[425,233],[425,320]],0xf47c3c,.8);
S.add(B);
B.scale.setScalar(.95);
}catch(e){console.warn('3D unavailable',e)}
addEventListener('pointermove',e=>{moved=1;px=e.clientX;py=e.clientY;mx=px/innerWidth*2-1;my=-(py/innerHeight*2-1)});
// ---- loop ----
const hl=$('#hl'),NM=$$('.nm');let wx=.5,lastY=scrollY,rot=0;
function frame(ms){const t=ms/1e3,v=scrollY-lastY;lastY=scrollY;
let k=0;BD.forEach((b,i)=>{if(b.getBoundingClientRect().top<innerHeight*.45)k=i});if(k!==cur){cur=k;hud(k)}
NM.forEach(n=>{n.style.transform=`translateY(${-n.parentElement.getBoundingClientRect().top*.18}px)`});
if(scrollY<innerHeight*1.2){
wx+=((RM?.5:moved?(mx+1)/2:.5+.5*Math.sin(t*.9))-wx)*.07;hl.style.fontVariationSettings=`'wdth' ${Math.round(55+wx*70)},'wght' 900`;
if(RC){rot+=cl(v,-60,60)*.012;rot*=.94;const r=$('#coin').getBoundingClientRect();
B.rotation.y=rot+cl((px-(r.left+r.width/2))/500,-1,1)*.9+(RM?0:Math.sin(t*.8)*.25);B.rotation.x=cl((py-(r.top+r.height/2))/500,-1,1)*-.5;RC.render(S,C)}}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
